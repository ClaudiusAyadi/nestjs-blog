name: nextjs-blog
services:
  postgres:
    image: postgres:latest
    container_name: nestjs_blog_db
    environment:
      POSTGRES_USER: dovely
      POSTGRES_PASSWORD: dovely_2025
      POSTGRES_DB: nestjs_blog_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
